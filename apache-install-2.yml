---
- hosts: linux
  user: sysadmin
  become: true

  tasks:
    - name: Set OS-family variables
      ansible.builtin.set_fact: 
        apache_package: "{{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}"

    - name: Instalar Apache
      ansible.builtin.package:
        name: "{{ apache_package }}"
        state: present

    - name: Iniciar Apache
      ansible.builtin.service:
        name: "{{ apache_package }}"
        state: started
        enabled: true

...
