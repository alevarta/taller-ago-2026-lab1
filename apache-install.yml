---
- hosts: linux
  user: sysadmin
  become: true

  tasks:
    - name: Instalar Apache en Ubuntu
      ansible.builtin.apt:
        name: apache2
        state: present
      when: ansible_facts["os_family"]== "Debian"

    - name: Iniciar Apache en Ubuntu
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: ansible_facts["os_family"]== "Debian"

    - name: Instalar Apache en Centos
      ansible.builtin.dnf:
        name: httpd
        state: present
      when: ansible_facts["os_family"]== "RedHat"

    - name: Iniciar Apache en Centos
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      when: ansible_facts["os_family"]== "RedHat"
...
